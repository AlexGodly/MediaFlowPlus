name: MediaFlow Plus one-way synchronization tests
on:
  push:
    branches: [main, feature/v416-one-way-autosync]
    paths: ['src/js/**', 'plus/**', 'VERSION', 'index.html', 'scripts/**', '.github/workflows/sync-personal-parity.yml', '.github/workflows/ui-regression-smoke.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression - no Personal writes and Plus features preserved
        run: |
          python -m py_compile plus/sync/sync.py
          python -m unittest discover -s plus/sync -p 'test_*.py' -v
      - name: Build and verify independent Supabase and overlays
        run: |
          set -euo pipefail
          python scripts/build.py
          VERSION="$(cat VERSION)"
          node --check "assets/js/mediaflow-v${VERSION}.bundle.js"
          grep -q 'puaqaobplyrdrujapznp.supabase.co' "assets/js/mediaflow-v${VERSION}.bundle.js"
          if grep -q 'wgeijxfdpgehesxialxm.supabase.co' "assets/js/mediaflow-v${VERSION}.bundle.js"; then exit 1; fi
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          version=int((r/'VERSION').read_text())
          state=json.loads((r/'plus/sync/state.json').read_text())
          assert state['plus_release']==version
          assert len(state['personal_sha'])==40
          assert json.loads((r/'version.json').read_text())['version']==version
          order=json.loads((r/'src/js/runtime-order.json').read_text())
          overlays=json.loads((r/'plus/extensions/manifest.json').read_text())
          assert len(order)>=157
          for module in overlays['runtime_modules']:
              assert 'components/plus/'+module in order
          print('Plus source, extension manifest, cloud and release metadata: PASS')
          PY
