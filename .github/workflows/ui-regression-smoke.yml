name: MediaFlow Plus Personal parity validation
on:
  push:
    branches: [main]
    paths: ['src/js/**', 'VERSION', 'index.html', '.github/workflows/ui-regression-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PersonaI source parity and Plus-only cloud
        run: |
          python scripts/build.py
          node --check "assets/js/mediaflow-v$(cat VERSION).bundle.js"
          test "$(cat VERSION)" = 415
          grep -q 'puaqaobplyrdrujapznp.supabase.co' assets/js/mediaflow-v415.bundle.js
          if grep -q 'wgeijxfdpgehesxialxm.supabase.co' assets/js/mediaflow-v415.bundle.js; then exit 1; fi
          python - <<'PY'
          import json,pathlib
          order=json.loads(pathlib.Path('src/js/runtime-order.json').read_text())
          assert len(order)==157 and order[-1]=='components/301-v408-performance-stability-ui.js'
          assert json.loads(pathlib.Path('version.json').read_text())['appVersion']==415
          print('Personal v410 source and Plus v415 cloud isolation confirmed.')
          PY
