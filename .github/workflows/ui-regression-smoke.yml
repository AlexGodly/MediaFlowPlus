name: Critical pages browser smoke
on:
  push:
    branches: [main, feature/v412-smart-filters-inbox-live-community]
    paths:
      - 'tests/community-critical-pages-smoke.cjs'
      - 'tests/test-v412-*.cjs'
      - 'tests/v412-membership-contract.cjs'
      - 'assets/css/30*-v412-*.css'
      - 'supabase/functions/mediaflow-plus-public-workspace/**'
      - '.github/workflows/ui-regression-smoke.yml'
      - 'src/js/**'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mediaflow-plus-ui-smoke-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build production bundle
        run: python scripts/build.py
      - name: Verify Community live-source contracts
        run: node tests/test-v412-community-portal.cjs
      - name: Verify source-linked public pages
        run: node tests/test-v412-live-public-pages.cjs
      - name: Verify privacy and publication revocation (synthetic Edge runtime)
        run: node tests/test-v412-edge-privacy.cjs
      - name: Verify v412 membership filter contracts
        run: |
          node tests/v412-membership-contract.cjs
          node tests/test-v412-membership-live.cjs
      - name: Check Workspace and Community menu contract
        run: node tests/test-v412-workspace-nav.cjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run synthetic-account browser smoke
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/mediaflow-http.log 2>&1 &
          sleep 2
          node tests/community-critical-pages-smoke.cjs
          node tests/test-v412-responsive-portal.cjs
