name: Auto-sync Personal stable releases to MediaFlow Plus

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/sync-personal-parity.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: mediaflow-plus-release
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Plus (only repository with write access)
        uses: actions/checkout@v4
        with:
          path: plus
          fetch-depth: 0
          persist-credentials: true

      - name: Find latest published stable Personal release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api 'repos/AlexGodly/MediaFlow/releases?per_page=40' --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^[0-9]+$")))] | sort_by(.published_at) | last | .tag_name // empty')"
          [[ "$TAG" =~ ^[0-9]+$ ]] || { echo "No stable numeric Personal release" >&2; exit 1; }
          CURRENT="$(python -c 'import json;print(json.load(open("plus/plus/sync/state.json"))["personal_tag"])')"
          if (( 10#$TAG < 10#$CURRENT )); then
            echo "Detected upstream version regression; refusing to modify Plus" >&2
            exit 1
          fi
          if [[ "$TAG" == "$CURRENT" ]]; then
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "Personal v$TAG is already mirrored; no changes required."
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Personal stable tag (read-only)
        if: steps.detect.outputs.sync == 'true'
        uses: actions/checkout@v4
        with:
          repository: AlexGodly/MediaFlow
          ref: ${{ steps.detect.outputs.tag }}
          path: personal
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /assets/
            /scripts/
            /VERSION
            /index.html
            /manifest.json
            /icon.svg
            /favicon.ico
            /package.json
            /vite.v260.config.ts
            /vite.v261.config.ts

      - name: Setup Python
        if: steps.detect.outputs.sync == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        if: steps.detect.outputs.sync == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test One-Way importer using synthetic Plus-exclusive features
        if: steps.detect.outputs.sync == 'true'
        run: python -m unittest discover -s plus/plus/sync -p 'test_*.py' -v

      - name: Import, build and verify before any publication
        id: build
        if: steps.detect.outputs.sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C personal rev-parse HEAD)"
          NEXT_VERSION="$(($(cat plus/VERSION) + 1))"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          python plus/plus/sync/sync.py --personal personal --plus plus \
            --tag "${{ steps.detect.outputs.tag }}" --sha "$SOURCE_SHA" \
            --next-version "$NEXT_VERSION"
          cd plus
          python scripts/build.py
          node --check "assets/js/mediaflow-v${NEXT_VERSION}.bundle.js"
          grep -q 'puaqaobplyrdrujapznp.supabase.co' "assets/js/mediaflow-v${NEXT_VERSION}.bundle.js"
          if grep -q 'wgeijxfdpgehesxialxm.supabase.co' "assets/js/mediaflow-v${NEXT_VERSION}.bundle.js"; then
            echo "Personal Supabase URL detected; refusing publication" >&2; exit 1
          fi
          grep -q "mediaflow-v${NEXT_VERSION}.bundle.js" index.html
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('.')
          version=int((p/'VERSION').read_text())
          manifest=json.loads((p/'plus/extensions/manifest.json').read_text())
          order=json.loads((p/'src/js/runtime-order.json').read_text())
          for name in manifest['runtime_modules']:
              assert 'components/plus/'+name in order
          for name in manifest['stylesheets']:
              assert 'assets/css/plus/'+name in (p/'index.html').read_text()
          assert json.loads((p/'version.json').read_text())['version']==version
          app=json.loads((p/'manifest.json').read_text())
          assert app['start_url']=='./' and app['scope']=='./'
          assert 'mediaflow-version" content="'+str(version)+'"' in (p/'index.html').read_text()
          print('Plus cloud and extensions verified. Prepared website passed safety gates.')
          PY

      - name: Publish Plus release with rollback protection
        if: steps.detect.outputs.sync == 'true'
        working-directory: plus
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_TAG: ${{ steps.detect.outputs.tag }}
          PERSONAL_SHA: ${{ steps.build.outputs.source_sha }}
          NEXT_VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "Immutable Plus release already exists; no update was published" >&2; exit 1
          fi
          git push origin "HEAD:refs/heads/backup/before-sync-${NEXT_VERSION}-personal-${PERSONAL_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh api "repos/AlexGodly/MediaFlow/releases/tags/${PERSONAL_TAG}" --jq '.body // ""' > /tmp/personal-release-notes.txt
          {
            printf '# MediaFlow Plus v%s — Personal v%s synchronization\n\n' "$NEXT_VERSION" "$PERSONAL_TAG"
            printf 'Inherited Personal stable v%s, commit %s.\n\n' "$PERSONAL_TAG" "$PERSONAL_SHA"
            printf 'Personal is read-only. Plus Supabase, existing user data, and Plus-exclusive extensions are retained.\n\n'
            printf '## Inherited Personal changes\n\n'
            cat /tmp/personal-release-notes.txt
            printf '\n\n## Rollback\n\n'
            printf 'backup/before-sync-%s-personal-%s\n' "$NEXT_VERSION" "$PERSONAL_TAG"
          } > "docs/CHANGELOG_v${NEXT_VERSION}.md"
          git add -A src assets scripts index.html manifest.json icon.svg favicon.ico \
            package.json vite.v260.config.ts vite.v261.config.ts VERSION version.json sw.js \
            plus/sync/state.json "docs/CHANGELOG_v${NEXT_VERSION}.md"
          if git diff --cached --quiet; then echo "No changes to release" >&2; exit 1; fi
          git commit -m "feat(v${NEXT_VERSION}): inherit Personal v${PERSONAL_TAG} with Plus overlays"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" --verify-tag --title "v${NEXT_VERSION} Stable" \
            --notes-file "docs/CHANGELOG_v${NEXT_VERSION}.md"
          gh api -X POST repos/AlexGodly/MediaFlowPlus/pages/builds >/dev/null
          echo "Plus published and Pages requested; no Personal writes."
